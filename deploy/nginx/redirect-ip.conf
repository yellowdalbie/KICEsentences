# 구 배포 주소 http://158.180.90.73:8181/ 로 들어온 요청을
# https://www.thinklynx.xyz 로 301 리다이렉트한다.
#
# 앱(Flask)은 127.0.0.1:8182 로 옮겼고, 8181 은 nginx 가 리다이렉트 전용으로 점유한다.
# 이 포트로는 앱이 응답하지 않으므로 nginx 우회(X-Forwarded-For 위조 등)가 불가능하다.
#
# 배치:
#   sudo cp deploy/nginx/redirect-ip.conf /etc/nginx/sites-available/redirect-ip.conf
#   sudo ln -s /etc/nginx/sites-available/redirect-ip.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 주의: 포트 80 은 건드리지 않는다. http://158.180.90.73/ 은 같은 서버의 다른 서비스
# (DMGrade, grade-check.conf 에서 server_name 158.180.90.73 으로 점유)가 쓰고 있다.

server {
    listen 8181;
    server_name _;

    location / {
        return 301 https://www.thinklynx.xyz$request_uri;
    }
}
