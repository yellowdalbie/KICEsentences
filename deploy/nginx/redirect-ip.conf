# 정식 도메인이 아닌 주소로 들어온 요청을 www.thinklynx.xyz 로 301 리다이렉트한다.
#
# 배치:
#   sudo cp deploy/nginx/redirect-ip.conf /etc/nginx/sites-available/redirect-ip.conf
#   sudo ln -s /etc/nginx/sites-available/redirect-ip.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 주의: 기존 설정에 이미 `default_server` 가 있으면 nginx -t 가 실패한다.
#   grep -rn "default_server" /etc/nginx/sites-enabled/ /etc/nginx/conf.d/
# 보통 Ubuntu 기본 파일 /etc/nginx/sites-enabled/default 가 원인이므로,
# 그 심볼릭 링크를 먼저 제거(sudo rm /etc/nginx/sites-enabled/default)한다.

# ── 포트 없는 IP 직접 접속 (http://158.180.90.73/) ──
server {
    listen 80 default_server;
    # IPv6 를 쓰는 경우에만 주석 해제
    # listen [::]:80 default_server;
    server_name _;

    # certbot 갱신(HTTP-01 챌린지)은 리다이렉트에서 제외
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://www.thinklynx.xyz$request_uri;
    }
}

# ── 구 배포 주소 (http://158.180.90.73:8181/) 호환용 ──
# 앱은 127.0.0.1:8182 로 옮겼고, 8181 은 nginx 가 리다이렉트 전용으로 점유한다.
# 이 포트로는 앱이 응답하지 않으므로 nginx 우회(X-Forwarded-For 위조 등)가 불가능하다.
server {
    listen 8181;
    server_name _;

    location / {
        return 301 https://www.thinklynx.xyz$request_uri;
    }
}
